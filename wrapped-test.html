<!DOCTYPE html>
<html><head><meta charset="utf-8">
<title>Wrapped Engine Test</title>
<link rel="stylesheet" href="/wrapped.css">
<style>body { font-family: ui-sans-serif, system-ui; padding: 2rem; background: #0c0d10; color: #e1e6ee }</style>
</head><body>
<h1>Wrapped Engine Smoke Test</h1>
<button onclick="run()">Play wrapped</button>
<pre id="out"></pre>
<script src="/wrapped.js"></script>
<script>
async function run() {
  const r = await DwinityWrapped.play([
    { duration: 2500, html: `<div class="wrapped-counter">42</div><h2>erste Slide</h2><p>Auto-advance in 2.5s. Tippen pausiert.</p>` },
    { duration: 2500, html: `<div class="wrapped-archetype-icon">🌅</div><h1 class="wrapped-accent">Frühaufsteher</h1><p>Slide 2 — Archetyp-Look.</p>` },
    { duration: 2500, html: `<h1>247 km</h1><h2>insgesamt</h2><p>Slide 3 — Distanz.</p>` },
    { duration: 999000, html: `
        <h1>Final</h1>
        <p>CTA-Slide. Klick zum Beenden.</p>
        <div class="wrapped-cta">
          <button class="wrapped-cta-primary" data-wrapped-cta="connect">Wallet verbinden</button>
          <button class="wrapped-cta-secondary" data-wrapped-cta="skip">Später</button>
        </div>
    ` },
  ]);
  document.getElementById("out").textContent = "Ende: " + JSON.stringify(r, null, 2);
}
</script>
</body></html>
